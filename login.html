<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In | NEOGATE</title>
    <link rel="stylesheet" href="design-system.css" />
    <link rel="stylesheet" href="login.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div class="login-card" id="main-content">
      <h1>
        <span><i class="fa-regular fa-face-smile"></i></span> NEOGATE
      </h1>
      <p>Log in to the future of Web3 connectivity</p>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="login-email">Email / Wallet Address</label>
          <input
            type="text"
            id="login-email"
            name="email"
            placeholder="Email or Wallet address"
            autocomplete="username"
            required
            aria-required="true"
            aria-describedby="email-error"
          />
          <span class="error-message" id="email-error" role="alert" aria-live="polite"></span>
        </div>
        <div class="form-group password-group">
          <label for="login-password">Password</label>
          <input
            type="password"
            id="login-password"
            name="password"
            placeholder="Password"
            autocomplete="current-password"
            required
            aria-required="true"
            aria-describedby="password-error"
          />
          <button
            type="button"
            class="password-toggle"
            aria-label="Toggle password visibility"
            aria-pressed="false"
          >
            <i class="fa-regular fa-eye"></i>
          </button>
          <span class="error-message" id="password-error" role="alert" aria-live="polite"></span>
        </div>
        <div class="form-group remember">
          <input type="checkbox" id="remember" name="remember" />
          <label for="remember">Remember me</label>
        </div>
        <button type="submit">Log In</button>
      </form>
      <p id="login-status" class="form-status" role="status" aria-live="polite"></p>
      <a href="#">Forgot Password?</a>
      <div class="signup-link">
        <p>Don't have an account? <a href="reg.html">Sign Up</a></p>
      </div>
    </div>

    <script src="login.js"></script>
  </body>
</html>
